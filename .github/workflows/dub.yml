name: 🎬 VietDub Run

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL cần dub"
        required: true
        type: string
      tts_engine:
        description: "TTS engine (vieneu = chính, edge = fallback nhẹ)"
        required: false
        default: "vieneu"
        type: choice
        options:
          - vieneu
          - edge
      upload_youtube:
        description: "Upload lên YouTube"
        required: false
        default: true
        type: boolean
      upload_facebook:
        description: "Upload lên Facebook"
        required: false
        default: true
        type: boolean

jobs:
  dub:
    name: 🎬 Dub video
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      # Cache model VieNeu (HuggingFace) — tránh tải lại mỗi lần chạy
      - name: Cache HuggingFace models
        if: ${{ inputs.tts_engine == 'vieneu' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-vieneu-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cài VieNeu bản mới nhất từ Git chỉ khi chọn engine vieneu
      - name: Install VieNeu-TTS (latest from Git)
        if: ${{ inputs.tts_engine == 'vieneu' }}
        run: pip install "git+https://github.com/pnnbao97/VieNeu-TTS.git"

      # Ghi cookies YouTube từ Secret ra file để yt-dlp né chặn IP datacenter
      - name: Write YouTube cookies
        if: ${{ secrets.YT_COOKIES != '' }}
        run: |
          printf '%s' "${{ secrets.YT_COOKIES }}" > yt_cookies.txt
          echo "YT_COOKIES_FILE=$GITHUB_WORKSPACE/yt_cookies.txt" >> "$GITHUB_ENV"

      - name: Run dub pipeline
        env:
          OPUS_API_KEY: ${{ secrets.OPUS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TTS_ENGINE: ${{ inputs.tts_engine }}
          # YouTube OAuth headless (refresh token tạo sẵn từ máy)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Facebook Page
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          ARGS="--url \"${{ inputs.url }}\" --output ./output"
          if [ "${{ inputs.upload_youtube }}" = "true" ]; then
            ARGS="$ARGS --upload-youtube"
          fi
          if [ "${{ inputs.upload_facebook }}" = "true" ]; then
            ARGS="$ARGS --upload-facebook"
          fi
          eval python backend/main.py $ARGS

      # Runner ephemeral: lưu video ra artifact để tải về (giữ 7 ngày)
      - name: Upload output artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vietdub-output
          path: |
            output/**/*.mp4
            output/**/*.srt
          if-no-files-found: warn
          retention-days: 7
